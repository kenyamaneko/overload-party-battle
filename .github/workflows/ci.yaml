name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  PROJECT_ID: keyandnotes-platform
  REPOSITORY: overload-party
  IMAGE_NAME: battle

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Authenticate NuGet (GitHub Packages)
        run: dotnet nuget update source github --username kenyamaneko --password ${{ secrets.COMMON_PKG_FETCH }} --store-password-in-clear-text
      - run: dotnet format --verify-no-changes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cross-Repo Deps App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko
      - name: Fetch cards_gen.json from common repo
        run: |
          curl -sSf -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/kenyamaneko/overload-party-common/contents/packages/game-state-dotnet/cache/cards_gen.json" \
            -o cards_gen.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up gcloud (Firestore emulator)
        uses: google-github-actions/setup-gcloud@v2
      - name: Install Firestore emulator component
        run: gcloud components install cloud-firestore-emulator beta --quiet
      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:9041 >/tmp/firestore.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:9041 >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator failed to start"; cat /tmp/firestore.log; exit 1
      - name: Authenticate NuGet (GitHub Packages)
        run: dotnet nuget update source github --username kenyamaneko --password ${{ secrets.COMMON_PKG_FETCH }} --store-password-in-clear-text
      - name: Run tests
        run: dotnet test tests/OverloadParty.Battle.Tests
        env:
          CARDS_JSON_PATH: ${{ github.workspace }}/cards_gen.json
          FIRESTORE_EMULATOR_HOST: localhost:9041
          FIRESTORE_PROJECT_ID: overload-party-test

  build-and-push:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build --build-arg NUGET_TOKEN=${{ secrets.COMMON_PKG_FETCH }} -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
