name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code change
        id: detect
        uses: kenyamaneko/overload-party-common/.github/actions/detect-code-change@main

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Configure Cloudsmith auth (NuGet)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "nuget"
      - name: Verify dotnet format
        run: dotnet format --verify-no-changes OverloadParty.Battle.slnx

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Configure Cloudsmith auth (NuGet)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "nuget"
      - name: Run tests
        run: dotnet test OverloadParty.Battle.slnx --logger "trx;LogFileName=test-results.trx"
        env:
          CARDS_JSON_PATH: ${{ github.workspace }}/packages/game-state-dotnet/cache/cards_gen.json
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/csharp-test-report@main
        with:
          search-root: tests
          title: 単体テスト結果
      - name: Extract test catalog source
        if: ${{ !cancelled() }}
        run: dotnet run --project tools/TestCatalogExtractor -- --tests-root tests --output test-catalog-source.json
      - name: Upload test catalog source
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-catalog-source
          path: test-catalog-source.json
          retention-days: 7

  codegen-sync:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/api-battle-rpc-go/go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up .NET (NSwag)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run codegen
        run: bash scripts/generate_types.sh
      - name: Verify no drift
        run: bash .github/scripts/ci/check-codegen-drift.sh
