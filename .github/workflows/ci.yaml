# post-merge image build & push は deploy.yaml に分離
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Configure Cloudsmith auth (NuGet)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "nuget"
      - name: Verify dotnet format
        run: dotnet format --verify-no-changes OverloadParty.Battle.slnx

  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up gcloud (Firestore emulator)
        uses: google-github-actions/setup-gcloud@v2
      - name: Install Firestore emulator component
        run: gcloud components install cloud-firestore-emulator beta --quiet
      - name: Start Firestore emulator
        run: bash .github/scripts/ci/start-firestore-emulator.sh
      - name: Configure Cloudsmith auth (NuGet)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "nuget"
      - name: Run tests
        run: dotnet test OverloadParty.Battle.slnx
        env:
          CARDS_JSON_PATH: ${{ github.workspace }}/packages/game-state-dotnet/cache/cards_gen.json
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:9041
          GOOGLE_CLOUD_PROJECT_ID: overload-party-test

  codegen-sync:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/api-battle-rpc-go/go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up .NET (NSwag)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run codegen
        run: bash scripts/generate_types.sh
      - name: Verify no drift
        run: bash .github/scripts/ci/check-codegen-drift.sh
