name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - game-logic-constants-go
          - api-battle-rpc-go
          - game-logic-constants-dotnet
          - game-state-dotnet
          - api-battle-rpc-dotnet
          - game-logic-constants-npm
          - game-state-npm

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect changes & compute versions
  # ──────────────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      # Go modules
      game_logic_constants_go: ${{ steps.detect.outputs.game_logic_constants_go }}
      game_logic_constants_go_version: ${{ steps.detect.outputs.game_logic_constants_go_version }}
      api_battle_rpc_go: ${{ steps.detect.outputs.api_battle_rpc_go }}
      api_battle_rpc_go_version: ${{ steps.detect.outputs.api_battle_rpc_go_version }}
      # C# csproj
      game_logic_constants_dotnet: ${{ steps.detect.outputs.game_logic_constants_dotnet }}
      game_logic_constants_dotnet_version: ${{ steps.detect.outputs.game_logic_constants_dotnet_version }}
      game_state_dotnet: ${{ steps.detect.outputs.game_state_dotnet }}
      game_state_dotnet_version: ${{ steps.detect.outputs.game_state_dotnet_version }}
      api_battle_rpc_dotnet: ${{ steps.detect.outputs.api_battle_rpc_dotnet }}
      api_battle_rpc_dotnet_version: ${{ steps.detect.outputs.api_battle_rpc_dotnet_version }}
      # npm packages
      game_logic_constants_npm: ${{ steps.detect.outputs.game_logic_constants_npm }}
      game_logic_constants_npm_version: ${{ steps.detect.outputs.game_logic_constants_npm_version }}
      game_state_npm: ${{ steps.detect.outputs.game_state_npm }}
      game_state_npm_version: ${{ steps.detect.outputs.game_state_npm_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and compute versions
        id: detect
        run: bash scripts/ci/detect-changes.sh "${{ inputs.target || 'auto' }}" "${{ inputs.bump || 'patch' }}"

  # ──────────────────────────────────────────────
  # 2. Build & validate before publishing
  # ──────────────────────────────────────────────
  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/game-logic-constants-go/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kenyamaneko"

      - name: Go vet + build (all modules)
        run: |
          for mod in packages/game-logic-constants-go packages/api-battle-rpc-go; do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./... && go build ./...)
            echo "::endgroup::"
          done

      - name: .NET build (all csproj)
        run: |
          for pkg in \
            game-logic-constants-dotnet \
            game-state-dotnet \
            api-battle-rpc-dotnet; do
            echo "::group::dotnet build $pkg"
            (cd "packages/$pkg" && dotnet build -c Release --nologo -v quiet)
            echo "::endgroup::"
          done

      - name: Build npm packages (via workspaces)
        run: |
          npm install
          # Layer 1 を先にビルド (game-state-npm の tsc が dist を参照するため)
          npm run build -w @kenyamaneko/overload-party-game-logic-constants
          npm run build -w @kenyamaneko/overload-party-game-state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COMMON_PKG_FETCH }}

  # ──────────────────────────────────────────────
  # 3. Publish Go modules (tag only — go get resolves via git tag)
  # ──────────────────────────────────────────────
  publish-go:
    name: Publish Go modules
    needs: [detect, build]
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go modules
        run: |
          declare -A MODULES=(
            [game-logic-constants-go]="${{ needs.detect.outputs.game_logic_constants_go }}:${{ needs.detect.outputs.game_logic_constants_go_version }}"
            [api-battle-rpc-go]="${{ needs.detect.outputs.api_battle_rpc_go }}:${{ needs.detect.outputs.api_battle_rpc_go_version }}"
          )
          for name in "${!MODULES[@]}"; do
            IFS=':' read -r changed ver <<< "${MODULES[$name]}"
            if [ "$changed" = "true" ]; then
              tag="packages/$name/v$ver"
              echo "Tagging $tag"
              git tag "$tag"
              git push origin "$tag"
            fi
          done

  # ──────────────────────────────────────────────
  # 4. Publish C# csproj packages (NuGet)
  # ──────────────────────────────────────────────
  publish-game-logic-constants-dotnet:
    name: Publish game-logic-constants-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.game_logic_constants_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish NuGet
        working-directory: packages/game-logic-constants-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.game_logic_constants_dotnet_version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          git tag "packages/game-logic-constants-dotnet/v${{ needs.detect.outputs.game_logic_constants_dotnet_version }}"
          git push origin "packages/game-logic-constants-dotnet/v${{ needs.detect.outputs.game_logic_constants_dotnet_version }}"

  publish-game-state-dotnet:
    name: Publish game-state-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.game_state_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish NuGet
        working-directory: packages/game-state-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.game_state_dotnet_version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          git tag "packages/game-state-dotnet/v${{ needs.detect.outputs.game_state_dotnet_version }}"
          git push origin "packages/game-state-dotnet/v${{ needs.detect.outputs.game_state_dotnet_version }}"

  publish-api-battle-rpc-dotnet:
    name: Publish api-battle-rpc-dotnet
    needs: [detect, build]
    if: needs.detect.outputs.api_battle_rpc_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish NuGet
        working-directory: packages/api-battle-rpc-dotnet
        run: |
          dotnet pack -c Release -p:Version=${{ needs.detect.outputs.api_battle_rpc_dotnet_version }} -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/kenyamaneko/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          git tag "packages/api-battle-rpc-dotnet/v${{ needs.detect.outputs.api_battle_rpc_dotnet_version }}"
          git push origin "packages/api-battle-rpc-dotnet/v${{ needs.detect.outputs.api_battle_rpc_dotnet_version }}"

  # ──────────────────────────────────────────────
  # 5. Publish npm Layer 1 (independent: game-logic-constants-npm)
  # ──────────────────────────────────────────────
  publish-game-logic-constants-npm:
    name: Publish game-logic-constants-npm
    needs: [detect, build]
    if: needs.detect.outputs.game_logic_constants_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kenyamaneko"
      - name: Install dependencies (from common)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COMMON_PKG_FETCH }}
        run: npm install
      - name: Build & publish npm
        working-directory: packages/game-logic-constants-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version ${{ needs.detect.outputs.game_logic_constants_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-logic-constants-npm/v${{ needs.detect.outputs.game_logic_constants_npm_version }}"
          git push origin "packages/game-logic-constants-npm/v${{ needs.detect.outputs.game_logic_constants_npm_version }}"

  # ──────────────────────────────────────────────
  # 6. Publish npm Layer 2 (game-state-npm — depends on Layer 1 + common)
  # ──────────────────────────────────────────────
  publish-game-state-npm:
    name: Publish game-state-npm
    needs:
      - detect
      - build
      - publish-game-logic-constants-npm
    if: |
      !failure() && !cancelled() &&
      needs.detect.outputs.game_state_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kenyamaneko"
      - name: Install dependencies (from common)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COMMON_PKG_FETCH }}
        run: npm install
      - name: Build Layer 1 (game-state-npm が型定義を参照するため)
        run: npm run build -w @kenyamaneko/overload-party-game-logic-constants
      - name: Build & publish npm
        working-directory: packages/game-state-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version ${{ needs.detect.outputs.game_state_npm_version }} --no-git-tag-version
          npm run build
          npm publish
      - name: Tag
        run: |
          git tag "packages/game-state-npm/v${{ needs.detect.outputs.game_state_npm_version }}"
          git push origin "packages/game-state-npm/v${{ needs.detect.outputs.game_state_npm_version }}"
