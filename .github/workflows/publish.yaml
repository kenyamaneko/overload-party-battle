name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/ci/**"
      - ".github/scripts/publish/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      target:
        description: "Package to publish (auto = detect changes)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - game-logic-constants-go
          - api-battle-rpc-go
          - game-logic-constants-dotnet
          - game-logic-constants-npm
          - game-state-npm

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    name: Detect changes
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      game_logic_constants_go: ${{ steps.detect.outputs.game_logic_constants_go }}
      game_logic_constants_go_version: ${{ steps.detect.outputs.game_logic_constants_go_version }}
      api_battle_rpc_go: ${{ steps.detect.outputs.api_battle_rpc_go }}
      api_battle_rpc_go_version: ${{ steps.detect.outputs.api_battle_rpc_go_version }}
      game_logic_constants_dotnet: ${{ steps.detect.outputs.game_logic_constants_dotnet }}
      game_logic_constants_dotnet_version: ${{ steps.detect.outputs.game_logic_constants_dotnet_version }}
      game_logic_constants_npm: ${{ steps.detect.outputs.game_logic_constants_npm }}
      game_logic_constants_npm_version: ${{ steps.detect.outputs.game_logic_constants_npm_version }}
      game_state_npm: ${{ steps.detect.outputs.game_state_npm }}
      game_state_npm_version: ${{ steps.detect.outputs.game_state_npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes and compute versions
        id: detect
        run: bash scripts/ci/detect-changes.sh "${{ inputs.target || 'auto' }}" "${{ inputs.bump || 'patch' }}"

  build:
    name: Build & validate
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/game-logic-constants-go/go.mod
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Cloudsmith auth (NuGet + npm)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "nuget,npm"
      - name: Go vet + build (all modules)
        run: |
          for mod in packages/game-logic-constants-go packages/api-battle-rpc-go; do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./... && go build ./...)
            echo "::endgroup::"
          done
      - name: .NET restore + build (sln)
        run: dotnet build OverloadParty.Battle.slnx -c Release --nologo -v quiet
      - name: Build npm packages
        run: |
          npm install
          npm run build -w @kenyamaneko/overload-party-game-logic-constants
          npm run build -w @kenyamaneko/overload-party-game-state

  publish-go:
    name: Publish Go modules
    needs: [detect, build]
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tag Go modules
        run: bash .github/scripts/publish/tag-go-modules.sh
        env:
          GLC_GO_CHANGED: ${{ needs.detect.outputs.game_logic_constants_go }}
          GLC_GO_VERSION: ${{ needs.detect.outputs.game_logic_constants_go_version }}
          ABR_GO_CHANGED: ${{ needs.detect.outputs.api_battle_rpc_go }}
          ABR_GO_VERSION: ${{ needs.detect.outputs.api_battle_rpc_go_version }}

  publish-dotnet:
    name: Publish dotnet packages (Cloudsmith)
    needs: [detect, build]
    if: needs.detect.outputs.game_logic_constants_dotnet == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack game-logic-constants-dotnet
        working-directory: packages/game-logic-constants-dotnet
        run: dotnet pack -c Release -p:Version=${{ needs.detect.outputs.game_logic_constants_dotnet_version }} -o ./nupkg
      - name: Publish game-logic-constants-dotnet to Cloudsmith
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: nuget
          package-path: packages/game-logic-constants-dotnet/nupkg/OverloadParty.GameLogicConstants.${{ needs.detect.outputs.game_logic_constants_dotnet_version }}.nupkg
      - name: Tag game-logic-constants-dotnet
        run: |
          tag="packages/game-logic-constants-dotnet/v${{ needs.detect.outputs.game_logic_constants_dotnet_version }}"
          git tag "$tag"
          git push origin "$tag"

  publish-npm:
    name: Publish npm packages (Cloudsmith)
    needs: [detect, build]
    if: |
      needs.detect.outputs.game_logic_constants_npm == 'true' ||
      needs.detect.outputs.game_state_npm == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Cloudsmith auth for npm (reader, for installs)
        uses: kenyamaneko/overload-party-common/.github/actions/setup-cloudsmith-auth@main
        with:
          role: reader
          formats: "npm"
      - name: Install dependencies
        run: npm install
      - name: Build & version Layer 1 (game-logic-constants-npm)
        if: needs.detect.outputs.game_logic_constants_npm == 'true'
        working-directory: packages/game-logic-constants-npm
        run: |
          npm version ${{ needs.detect.outputs.game_logic_constants_npm_version }} --no-git-tag-version
          npm run build
      - name: Publish Layer 1 to Cloudsmith
        if: needs.detect.outputs.game_logic_constants_npm == 'true'
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: npm
          package-path: packages/game-logic-constants-npm
      - name: Tag Layer 1
        if: needs.detect.outputs.game_logic_constants_npm == 'true'
        run: |
          tag="packages/game-logic-constants-npm/v${{ needs.detect.outputs.game_logic_constants_npm_version }}"
          git tag "$tag"
          git push origin "$tag"
      - name: Build Layer 1 if not published (Layer 2 が型定義を参照するため)
        if: needs.detect.outputs.game_logic_constants_npm != 'true' && needs.detect.outputs.game_state_npm == 'true'
        run: npm run build -w @kenyamaneko/overload-party-game-logic-constants
      - name: Build & version Layer 2 (game-state-npm)
        if: needs.detect.outputs.game_state_npm == 'true'
        working-directory: packages/game-state-npm
        run: |
          npm version ${{ needs.detect.outputs.game_state_npm_version }} --no-git-tag-version
          npm run build
      - name: Publish Layer 2 to Cloudsmith
        if: needs.detect.outputs.game_state_npm == 'true'
        uses: kenyamaneko/overload-party-common/.github/actions/publish-to-cloudsmith@main
        with:
          format: npm
          package-path: packages/game-state-npm
      - name: Tag Layer 2
        if: needs.detect.outputs.game_state_npm == 'true'
        run: |
          tag="packages/game-state-npm/v${{ needs.detect.outputs.game_state_npm_version }}"
          git tag "$tag"
          git push origin "$tag"
