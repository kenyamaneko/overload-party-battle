budget:
  low_threshold: 1500
  maintenance_limit_ratio: 0.8

game_phases:
  late:
    condition:
      turn_min: 6
      count:
        selector: { owner: myself }
        min: 3
    target_selection:
      attack:
        selector: { owner: opponent }
        order_by: tp_desc
    effect_priorities:
      single_damage: 80
      aoe_damage: 85

deploy:
  priorities:
    - card_id: SH-0001
      priority: 80
    - card_type: Compute
      priority: 50
    - card_type: DataResource
      priority: 40
    - card_type: Platform
      priority: 30
    - card_type: Attachment
      priority: 60

  choices:
    SH-0006: use

  zone_preferences:
    Compute: [frontend, backend]
    DataResource: [backend]
    ObjectStorage: [backend, frontend]
    Platform: [support]
    Attachment: [support]

immediate_cards:
  always_use: [draw, search, deploy_free]
  hold_until:
    - card_type: Incident
      condition:
        selector: { owner: opponent, zone: frontend }
        min: 2

effect_priorities:
  budget_gain:
    priority: 90
    low_priority: 40
    threshold: 1500
  budget_penalty: 60
  insight_gain: 50
  insight_absorb:
    priority: 65
    condition:
      selector: { owner: opponent }
      min: 1
  draw:
    priority: 80
    low_priority: 30
    hand_threshold: 3
  search:
    priority: 70
    low_priority: 25
    hand_threshold: 3
  aoe_damage:
    priority: 75
    min_targets: 2
  single_damage: 60
  debuff:
    priority: 55
    condition:
      selector: { owner: opponent }
      min: 1
  buff:
    priority: 45
    condition:
      selector: { owner: myself }
      min: 1
  heal:
    priority: 50
    condition:
      stat: damage
      selector: { owner: myself }
      min: 1
  deploy_free: 75
  recover_card: 35
  reveal_reactive:
    priority: 35
    condition:
      selector: { owner: opponent, zone: support, face_down: true }
      min: 1
  destroy_platform:
    priority: 70
    condition:
      selector: { owner: opponent }
      card_type: Platform
      min: 1

target_selection:
  attack:
    selector: { owner: opponent }
    order_by: av_asc
  single_damage:
    selector: { owner: opponent }
    order_by: av_asc
  debuff:
    selector: { owner: opponent }
    order_by: tp_desc
  buff:
    selector: { owner: myself }
    order_by: tp_desc
  heal:
    selector: { owner: myself }
    order_by: damage_desc

scale_up:
  instance_family: M
  max_maintenance_ratio: 0.6
  order_by: tp_desc

monetize:
  order_by: tp_desc
  reserve_ratio: 0.2

attachments:
  SH-0016:
    priority: 80
    target:
      selector: { owner: myself, card_id: [SH-0001] }
      order_by: tp_desc
  NT-0025:
    priority: 70
    target:
      selector: { owner: myself }
      order_by: tp_desc

reactive:
  max_slots: 2
  priorities:
    NT-0023: 90

slot_select:
  strategy: left_fill
