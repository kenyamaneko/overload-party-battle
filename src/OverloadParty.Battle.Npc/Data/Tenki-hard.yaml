    copies: 2
  - card_id: NT-0024
    copies: 1

budget:
  low_threshold: 1500
  maintenance_limit_ratio: 0.8

game_phases:
  late:
    condition:
      turn_min: 6
      count:
        selector: { owner: self }
        min: 3
    target_selection:
      attack: strongest_tp
    effect_priorities:
      single_damage: 80
      aoe_damage: 85

deploy:
  priorities:
    - card_id: TK-0010
      priority: 100
    - card_type: compute
      priority: 50
    - card_type: data
      priority: 40
    - card_type: platform
      priority: 30
    - card_type: attachment
      priority: 60

  conditional_priorities:
    - card_id: TK-0005
      priority: 90
      condition:
        selector: { owner: self }
        card_id: [TK-0010]
        min: 1
      fallback_priority: 70
    - card_id: TK-0008
      priority: 85
      condition:
        selector: { owner: self, zone: backend }
        card_type: data
        min: 2
      fallback_priority: 60

  zone_preferences:
    compute: [frontend, backend]
    data: [backend]
    object_storage: [backend, frontend]
    platform: [support]
    attachment: [support]

immediate_cards:
  always_use: [draw, search, deploy_free]
  hold_until:
    - card_type: incident
      condition:
        selector: { owner: opponent, zone: frontend }
        min: 2

effect_priorities:
  budget_gain:
    priority: 90
    low_priority: 40
    threshold: 1500
  budget_penalty: 60
  insight_gain: 50
  insight_absorb:
    priority: 65
    condition:
      selector: { owner: opponent }
      min: 1
  draw:
    priority: 80
    low_priority: 30
    hand_threshold: 3
  search:
    priority: 70
    low_priority: 25
    hand_threshold: 3
  aoe_damage:
    priority: 75
    min_targets: 2
  single_damage: 60
  debuff:
    priority: 55
    condition:
      selector: { owner: opponent }
      min: 1
  buff:
    priority: 45
    condition:
      selector: { owner: self }
      min: 1
  heal:
    priority: 50
    condition:
      stat: damage
      selector: { owner: self }
      min: 1
  deploy_free: 75
  recover_card: 35
  reveal_reactive:
    priority: 35
    condition:
      selector: { owner: opponent, zone: support, face_down: true }
      min: 1
  destroy_platform:
    priority: 70
    condition:
      selector: { owner: opponent }
      card_type: platform
      min: 1

target_selection:
  attack: weakest_av
  single_damage: weakest_av
  debuff: strongest_tp
  buff: strongest_tp
  heal: most_damaged

scale_up:
  instance_family: R
  conditional_family:
    - family: M
      condition:
        selector: { owner: self, card_type: data, zone: backend }
        min: 2
  max_maintenance_ratio: 0.6
  priority: highest_tp

monetize:
  strategy: highest_tp
  reserve_ratio: 0.2


reactive:
  max_slots: 2
  priorities:
    NT-0024: 70

slot_select:
  strategy: left_fill
