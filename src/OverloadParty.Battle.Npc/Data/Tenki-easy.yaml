deck:
  - card_id: TK-0001
    copies: 2
  - card_id: TK-0004
    copies: 3
  - card_id: TK-0005
    copies: 2
  - card_id: TK-0007
    copies: 3
  - card_id: TK-0009
    copies: 1
  - card_id: TK-0010
    copies: 3
  - card_id: TK-0013
    copies: 2
  - card_id: TK-0014
    copies: 1
  - card_id: TK-0015
    copies: 3
  - card_id: TK-0018
    copies: 1
  - card_id: TK-0024
    copies: 2
  - card_id: NT-0004
    copies: 1
  - card_id: NT-0007
    copies: 1
  - card_id: NT-0008
    copies: 1
  - card_id: NT-0009
    copies: 1
  - card_id: NT-0010
    copies: 2
  - card_id: NT-0024
    copies: 1

budget:
  low_threshold: 1500
  maintenance_limit_ratio: 0.8

deploy:
  priorities:
    - card_type: Compute
      priority: 50
    - card_type: DataResource
      priority: 40
    - card_type: Platform
      priority: 30
    - card_type: Attachment
      priority: 60

  zone_preferences:
    Compute: [frontend, backend]
    DataResource: [backend]
    ObjectStorage: [backend, frontend]
    Platform: [support]
    Attachment: [support]

immediate_cards:
  always_use: [draw, search, deploy_free]

effect_priorities:
  budget_gain:
    priority: 90
    low_priority: 40
    threshold: 1500
  budget_penalty: 60
  insight_gain: 50
  insight_absorb:
    priority: 65
    condition:
      selector: { owner: opponent }
      min: 1
  draw:
    priority: 80
    low_priority: 30
    hand_threshold: 3
  search:
    priority: 70
    low_priority: 25
    hand_threshold: 3
  aoe_damage:
    priority: 75
    min_targets: 2
  single_damage: 60
  debuff:
    priority: 55
    condition:
      selector: { owner: opponent }
      min: 1
  buff:
    priority: 45
    condition:
      selector: { owner: myself }
      min: 1
  heal:
    priority: 50
    condition:
      stat: damage
      selector: { owner: myself }
      min: 1
  deploy_free: 75
  recover_card: 35
  reveal_reactive:
    priority: 35
    condition:
      selector: { owner: opponent, zone: support, face_down: true }
      min: 1
  destroy_platform:
    priority: 70
    condition:
      selector: { owner: opponent }
      card_type: Platform
      min: 1

target_selection:
  attack:
    selector: { owner: opponent }
    order_by: av_asc
  single_damage:
    selector: { owner: opponent }
    order_by: av_asc
  debuff:
    selector: { owner: opponent }
    order_by: tp_desc
  buff:
    selector: { owner: myself }
    order_by: tp_desc
  heal:
    selector: { owner: myself }
    order_by: damage_desc

scale_up:
  instance_family: R
  max_maintenance_ratio: 0.6
  order_by: tp_desc

monetize:
  order_by: tp_desc
  reserve_ratio: 0.0

attachments:
  TK-0015:
    priority: 60
    target:
      selector: { owner: myself }
      order_by: tp_desc
  TK-0018:
    priority: 50
    target:
      selector: { owner: myself }
      order_by: tp_desc
  NT-0004:
    priority: 40
    target:
      selector: { owner: myself }
      order_by: tp_desc

reactive:
  max_slots: 2
  priorities:
    TK-0024: 70
    NT-0024: 60

slot_select:
  strategy: left_fill
