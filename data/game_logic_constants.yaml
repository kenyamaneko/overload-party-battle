# Game logic constants (SSoT).
#
# Runtime game state machine enums — owned by battle conceptually (per ADR-015),
# but physically lives in common until battle repo is created (ADR-011).
#
# Per ADR-015 Phase 1, this file is split out of the former data/constants.yaml.
# Consumers: battle (primary), gateway (subset for RPC dispatch), client (subset for display).
#
# Consumed by scripts/generate_types.py → packages/game-logic-constants/
#                                            → packages/game-logic-constants-dotnet/
#                                            → packages/game-logic-constants-npm/src/index.ts

