    # ─── Variant types: AvailableAction (flat class with type discriminator) ──
    AvailableAction:
      type: object
      description: |
        プレイヤーが現ターンに実行可能なアクション 1 件。`type` がアクション種別
        (play_card / attack など) を示し、その種別に必要なフィールドだけを持つ。
      x-battle-csharp-package: state
      required: [type]
      discriminator:
        propertyName: type
        mapping:
          play_card: "#/components/schemas/PlayCardAction"
          attack: "#/components/schemas/AttackAction"
          scale_up: "#/components/schemas/ScaleUpAction"
          monetize: "#/components/schemas/MonetizeAction"
          use_ignition: "#/components/schemas/UseIgnitionAction"
          use_initiative: "#/components/schemas/UseInitiativeAction"
          resolve_pending_choice: "#/components/schemas/ResolvePendingChoiceAction"
      properties:
        type:
          type: string

