    TurnControlsMessage:
      type: object
      description: 現在のターン操作可否を表すメッセージ。
      x-battle-csharp-package: state
      required: [canEndPhase, discardRequired]
      properties:
        canEndPhase:
          type: boolean
          description: 現在のフェーズを終了できるか (main / battle フェーズで `true`)
        discardRequired:
          type: integer
          format: int32
          description: 手札破棄が必要な枚数 (end フェーズで手札 > 6 枚の場合のみ > 0)

    # ─── Variant types: AvailableAction (flat class with type discriminator) ──
    AvailableAction:
      type: object
      description: |
        プレイヤーが現ターンに実行可能なアクション。`type` discriminator で variant を判別する。
        各 variant 固有のフィールドは optional。flat shape を維持しているのは既存 C# server / TS client
        の実装を温存するため (oneOf による正規化は将来検討)。
      x-battle-csharp-package: state
      required: [type]
      properties:
        type:
          type: string
          description: |
            variant 種別。`play_card` / `attack` / `scale_up` / `monetize` / `use_effect` のいずれか。
        # play_card variant
        handInstanceID:
          type: string
          x-go-name: HandInstanceID
          x-csharp-name: HandInstanceID
        cardID:
          type: string
          x-go-name: CardID
          x-csharp-name: CardID
        validZones:
          type: array
          items:
            type: string
        validTargets:
          type: array
          items:
            type: string
        cost:
          type: integer
          format: int32
        choiceOptions:
          type: array
          items:
            type: string
        # attack variant
        sourceInstanceID:
          type: string
          x-go-name: SourceInstanceID
          x-csharp-name: SourceInstanceID
        # scale_up variant
        targetRank:
          type: string
        instanceFamily:
          type: string
        needsFamily:
          type: boolean
        # monetize variant
        remainingCapacity:
          type: integer
          format: int64
        # use_effect variant
        effectTargetType:
          type: string
        requiredCount:
          type: integer
          format: int32

