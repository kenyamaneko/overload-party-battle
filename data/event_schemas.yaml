# Event data schemas for each EventType. Used to generate typed classes (C#) and TypeScript types. Field suffix '?' means optional.

play_card:
  cardId: string
  zone: string
  index: int
  cancelled?: bool
attach_card:
  cardId: string
  targetId: string
attack:
  attackerId: string
  targetId: string
  damage: long
  destroyed: bool
  slaPenalty?: long
  cancelled?: bool
scale_up:
  instanceId: string
  targetRank: string
  instanceFamily?: string
monetize:
  totalAmount: long
discard_hand:
  discardedCount: int
  discardedIds: string[]
use_effect:
  cardId: string
  sourceId: string
  targetId?: string
phase_change:
  previousPhase: string
  currentPhase: string
phase_end:
  phase: string
  needsDiscard: bool
turn_end:
  phase: string
  nextTurn: long
  activePlayer: long
  currentPhase: string
battle_start:
  match_type: string
  my_name: string
  my_level: long
  opponent_name: string
  opponent_level: long
turn_start:
  turn: long
  is_my_turn: bool
reactive_revealed:
  instanceId: string
  cardId: string
select_slot:
  cardId: string
  instanceId: string
  zone: string
  index: int
game_over:
  winnerNum: long
  winReason: string
